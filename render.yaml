services:
  # Backend - SMTP Email Server
  - type: web
    name: kelly-website-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FROM_NAME
        value: Kelly Ohgee
      - key: ADMIN_EMAIL
        sync: false
      - key: NODE_ENV
        value: production
